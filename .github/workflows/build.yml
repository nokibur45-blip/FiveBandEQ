name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: unzip FiveBandEQ.zip
      - run: gradle assembleDebug
        working-directory: FiveBandEQ
      - uses: actions/upload-artifact@v4
        with:
          name: FiveBandEQ-apk
          path: FiveBandEQ/app/build/outputs/apk/debug/app-debug.apk
